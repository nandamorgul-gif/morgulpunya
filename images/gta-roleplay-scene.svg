<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">SEMEISTVO TECH — Next-Gen GTA 5 Roleplay Server Architecture</title>
  <desc id="desc">Visual orisinal bertema kota GTA 5 Roleplay malam hari dengan gedung pencakar langit berlampu neon ungu dan cyan, jalan raya bercahaya, mobil patroli &amp; sports car, serta integrasi HUD FiveM.</desc>
  <defs>
    <!-- Background Sky Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07040d"/>
      <stop offset="35%" stop-color="#140926"/>
      <stop offset="65%" stop-color="#2a0d3f"/>
      <stop offset="85%" stop-color="#4d1656"/>
      <stop offset="100%" stop-color="#180b29"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7bca" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#c840e6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7a149c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0066cc" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#001a4d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b838ff" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#691696" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1f0330" stop-opacity="0"/>
    </radialGradient>

    <!-- Highway & Neon Gradients -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c162b"/>
      <stop offset="30%" stop-color="#120e1e"/>
      <stop offset="100%" stop-color="#08060d"/>
    </linearGradient>
    <linearGradient id="trailCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f3ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="trailRed" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0"/>
      <stop offset="60%" stop-color="#ff1744" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff8a80" stop-opacity="1"/>
    </linearGradient>

    <!-- Glass & Card Overlays -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1c0b30" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a829f0"/>
      <stop offset="100%" stop-color="#00d9ff"/>
    </linearGradient>

    <!-- Filters for Bloom & Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="highGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>

  <!-- STARS -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="80" r="1.5"/><circle cx="280" cy="45" r="1"/><circle cx="410" cy="110" r="1.2"/>
    <circle cx="560" cy="65" r="1"/><circle cx="730" cy="95" r="1.8"/><circle cx="890" cy="40" r="1.2"/>
    <circle cx="1040" cy="85" r="1.5"/><circle cx="1180" cy="50" r="1"/><circle cx="1340" cy="100" r="1.5"/>
    <circle cx="1490" cy="60" r="1.2"/><circle cx="210" cy="140" r="1"/><circle cx="670" cy="150" r="1.2"/>
    <circle cx="980" cy="130" r="1"/><circle cx="1420" cy="140" r="1.5"/>
  </g>

  <!-- MOON & ATMOSPHERIC HALO -->
  <circle cx="1260" cy="200" r="220" fill="url(#moonGlow)"/>
  <circle cx="1260" cy="200" r="54" fill="#ffe6f3" filter="url(#softGlow)"/>

  <!-- DISTANT MOUNTAINS / VINEWOOD HILLS SILHOUETTE -->
  <path d="M0 480 Q180 370 380 410 T820 390 T1260 410 Q1450 360 1600 420 L1600 680 L0 680 Z" fill="#130922" opacity="0.85"/>
  <path d="M0 520 Q240 430 490 470 T1040 450 T1600 480 L1600 700 L0 700 Z" fill="#1b0e2f" opacity="0.95"/>

  <!-- HORIZON GLOW STRIP -->
  <rect x="0" y="510" width="1600" height="90" fill="url(#purpleHalo)" opacity="0.45"/>
  <line x1="0" y1="560" x2="1600" y2="560" stroke="#ff41b4" stroke-width="3" opacity="0.35" filter="url(#softGlow)"/>

  <!-- FAR CITY LAYER (Background Towers & Window Grids) -->
  <g fill="#171026" stroke="#2d1945" stroke-width="1.5">
    <rect x="80" y="340" width="75" height="260"/>
    <rect x="180" y="290" width="95" height="310"/>
    <rect x="300" y="360" width="85" height="240"/>
    <rect x="420" y="270" width="110" height="330"/>
    <rect x="560" y="320" width="90" height="280"/>
    <rect x="680" y="250" width="130" height="350"/>
    <rect x="840" y="310" width="105" height="290"/>
    <rect x="975" y="240" width="125" height="360"/>
    <rect x="1130" y="330" width="90" height="270"/>
    <rect x="1250" y="280" width="115" height="320"/>
    <rect x="1395" y="350" width="120" height="250"/>
  </g>

  <!-- MIDGROUND TOWERS WITH LIT WINDOWS & NEON ACCENTS -->
  <g>
    <!-- Tower 1 -->
    <rect x="140" y="260" width="110" height="360" fill="#1d1233" stroke="#48256e" stroke-width="2"/>
    <line x1="140" y1="260" x2="250" y2="260" stroke="#00f3ff" stroke-width="4" filter="url(#softGlow)"/>
    <!-- Windows -->
    <g fill="#ffe599" opacity="0.75">
      <rect x="155" y="280" width="8" height="14" rx="1"/><rect x="175" y="280" width="8" height="14" rx="1"/><rect x="215" y="280" width="8" height="14" rx="1"/>
      <rect x="155" y="320" width="8" height="14" rx="1"/><rect x="195" y="320" width="8" height="14" rx="1"/><rect x="215" y="320" width="8" height="14" rx="1"/>
      <rect x="175" y="360" width="8" height="14" rx="1"/><rect x="195" y="360" width="8" height="14" rx="1"/>
      <rect x="155" y="410" width="8" height="14" rx="1"/><rect x="215" y="410" width="8" height="14" rx="1"/>
      <rect x="175" y="460" width="8" height="14" rx="1"/><rect x="195" y="460" width="8" height="14" rx="1"/><rect x="215" y="460" width="8" height="14" rx="1"/>
    </g>

    <!-- Tower 2 (Center-Left Highrise) -->
    <rect x="360" y="190" width="130" height="430" fill="#20133a" stroke="#562885" stroke-width="2"/>
    <!-- Rooftop Antenna -->
    <line x1="425" y1="190" x2="425" y2="120" stroke="#7e41b5" stroke-width="3"/>
    <circle cx="425" cy="118" r="4" fill="#ff1744" filter="url(#highGlow)"/>
    <line x1="360" y1="190" x2="490" y2="190" stroke="#ff3df4" stroke-width="4" filter="url(#softGlow)"/>
    <!-- Neon Sign on Building -->
    <rect x="380" y="220" width="90" height="28" rx="4" fill="#0d0718" stroke="#00f3ff" stroke-width="2"/>
    <text x="425" y="239" fill="#00f3ff" font-family="'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="3" filter="url(#softGlow)">FIVEM</text>
    <g fill="#9bf2ea" opacity="0.8">
      <rect x="380" y="270" width="10" height="15" rx="1"/><rect x="405" y="270" width="10" height="15" rx="1"/><rect x="455" y="270" width="10" height="15" rx="1"/>
      <rect x="405" y="310" width="10" height="15" rx="1"/><rect x="430" y="310" width="10" height="15" rx="1"/><rect x="455" y="310" width="10" height="15" rx="1"/>
      <rect x="380" y="360" width="10" height="15" rx="1"/><rect x="430" y="360" width="10" height="15" rx="1"/>
      <rect x="405" y="420" width="10" height="15" rx="1"/><rect x="455" y="420" width="10" height="15" rx="1"/>
    </g>

    <!-- Center Grand Tower (Maze Bank Style Core) -->
    <rect x="680" y="140" width="160" height="480" fill="#241442" stroke="#6831a3" stroke-width="2.5"/>
    <!-- Helipad Crown -->
    <polygon points="660,140 760,105 860,140" fill="#2c1752" stroke="#ff41b4" stroke-width="3" filter="url(#softGlow)"/>
    <circle cx="760" cy="103" r="5" fill="#ff1744" filter="url(#highGlow)"/>
    <!-- Crown Neon Sign -->
    <rect x="705" y="155" width="110" height="32" rx="5" fill="#0e061c" stroke="#ff2a85" stroke-width="2"/>
    <text x="760" y="177" fill="#ff2a85" font-family="'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="4" filter="url(#softGlow)">SEMEISTVO</text>
    <!-- Cyan Window Bands -->
    <g fill="#fffae0" opacity="0.85">
      <rect x="705" y="210" width="12" height="18" rx="1"/><rect x="730" y="210" width="12" height="18" rx="1"/><rect x="780" y="210" width="12" height="18" rx="1"/><rect x="805" y="210" width="12" height="18" rx="1"/>
      <rect x="705" y="250" width="12" height="18" rx="1"/><rect x="755" y="250" width="12" height="18" rx="1"/><rect x="780" y="250" width="12" height="18" rx="1"/>
      <rect x="730" y="300" width="12" height="18" rx="1"/><rect x="755" y="300" width="12" height="18" rx="1"/><rect x="805" y="300" width="12" height="18" rx="1"/>
      <rect x="705" y="350" width="12" height="18" rx="1"/><rect x="730" y="350" width="12" height="18" rx="1"/><rect x="780" y="350" width="12" height="18" rx="1"/>
      <rect x="755" y="400" width="12" height="18" rx="1"/><rect x="805" y="400" width="12" height="18" rx="1"/>
    </g>

    <!-- Tower 4 (Center-Right Sleek Skyscraper) -->
    <rect x="960" y="200" width="135" height="420" fill="#1e1136" stroke="#4d2379" stroke-width="2"/>
    <line x1="960" y1="200" x2="1095" y2="200" stroke="#00f3ff" stroke-width="4" filter="url(#softGlow)"/>
    <rect x="990" y="230" width="75" height="24" rx="3" fill="#0d0718" stroke="#b537f2" stroke-width="1.5"/>
    <text x="1027" y="247" fill="#b537f2" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="3" filter="url(#softGlow)">RP 24/7</text>
    <g fill="#ffe0b2" opacity="0.75">
      <rect x="980" y="280" width="9" height="15" rx="1"/><rect x="1005" y="280" width="9" height="15" rx="1"/><rect x="1055" y="280" width="9" height="15" rx="1"/>
      <rect x="980" y="325" width="9" height="15" rx="1"/><rect x="1030" y="325" width="9" height="15" rx="1"/><rect x="1055" y="325" width="9" height="15" rx="1"/>
      <rect x="1005" y="380" width="9" height="15" rx="1"/><rect x="1030" y="380" width="9" height="15" rx="1"/>
      <rect x="980" y="430" width="9" height="15" rx="1"/><rect x="1055" y="430" width="9" height="15" rx="1"/>
    </g>

    <!-- Tower 5 (Right Spire) -->
    <rect x="1220" y="240" width="120" height="380" fill="#1b0f30" stroke="#461f6e" stroke-width="2"/>
    <line x1="1280" y1="240" x2="1280" y2="160" stroke="#7e41b5" stroke-width="2.5"/>
    <circle cx="1280" cy="158" r="4" fill="#ff1744" filter="url(#highGlow)"/>
    <line x1="1220" y1="240" x2="1340" y2="240" stroke="#ff2a85" stroke-width="4" filter="url(#softGlow)"/>
    <g fill="#ffecb3" opacity="0.7">
      <rect x="1240" y="270" width="8" height="14" rx="1"/><rect x="1265" y="270" width="8" height="14" rx="1"/><rect x="1310" y="270" width="8" height="14" rx="1"/>
      <rect x="1240" y="320" width="8" height="14" rx="1"/><rect x="1285" y="320" width="8" height="14" rx="1"/><rect x="1310" y="320" width="8" height="14" rx="1"/>
      <rect x="1265" y="370" width="8" height="14" rx="1"/><rect x="1285" y="370" width="8" height="14" rx="1"/>
      <rect x="1240" y="430" width="8" height="14" rx="1"/><rect x="1310" y="430" width="8" height="14" rx="1"/>
    </g>
  </g>

  <!-- FOREGROUND HIGHWAY & INFRASTRUCTURE -->
  <polygon points="0,580 1600,560 1600,900 0,900" fill="url(#roadGrad)"/>
  <!-- Overpass Bridge Structure -->
  <path d="M0 620 L1600 600 L1600 635 L0 655 Z" fill="#251b3d" stroke="#60378b" stroke-width="2"/>
  <!-- Guardrails with Neon Glow -->
  <line x1="0" y1="620" x2="1600" y2="600" stroke="#00f3ff" stroke-width="3" opacity="0.8" filter="url(#softGlow)"/>
  <line x1="0" y1="655" x2="1600" y2="635" stroke="#b537f2" stroke-width="2" opacity="0.6"/>

  <!-- SPEEDING VEHICLES & LIGHT TRAILS -->
  <!-- Left to Right (Cyan Headlights & White Streaks) -->
  <path d="M40 730 C300 710 650 680 1150 645" stroke="url(#trailCyan)" stroke-width="7" fill="none" opacity="0.9" filter="url(#softGlow)"/>
  <path d="M20 740 C280 720 620 690 1100 655" stroke="url(#trailCyan)" stroke-width="4" fill="none" opacity="0.75"/>
  <!-- Right to Left (Red Taillights Streaks) -->
  <path d="M1580 770 C1200 780 750 790 280 810" stroke="url(#trailRed)" stroke-width="8" fill="none" opacity="0.9" filter="url(#softGlow)"/>
  <path d="M1600 785 C1250 795 800 805 320 825" stroke="url(#trailRed)" stroke-width="5" fill="none" opacity="0.8"/>

  <!-- VEHICLE 1: SLEEK SPORTS / TUNER CAR (Mid-Ground Silhouette) -->
  <g transform="translate(480, 680)">
    <!-- Cyan Underglow Glow -->
    <ellipse cx="140" cy="55" rx="145" ry="16" fill="url(#cyanHalo)"/>
    <!-- Car Body Shape -->
    <path d="M15 48 C30 38 60 30 100 24 C130 12 170 10 215 18 C240 24 255 35 275 42 C285 46 288 52 280 56 C265 59 30 60 15 54 Z" fill="#0d0917" stroke="#00f3ff" stroke-width="1.8"/>
    <!-- Windows & Cabin -->
    <path d="M115 25 C135 15 165 14 205 20 C220 24 235 32 245 38 L125 38 Z" fill="#2a1a45" stroke="#00f3ff" stroke-width="1.2"/>
    <!-- Wheels -->
    <circle cx="70" cy="52" r="15" fill="#120c21" stroke="#48256e" stroke-width="2"/>
    <circle cx="70" cy="52" r="8" fill="#00f3ff" opacity="0.8" filter="url(#softGlow)"/>
    <circle cx="230" cy="50" r="15" fill="#120c21" stroke="#48256e" stroke-width="2"/>
    <circle cx="230" cy="50" r="8" fill="#00f3ff" opacity="0.8" filter="url(#softGlow)"/>
    <!-- Headlight & Tail Beam -->
    <polygon points="275,42 380,36 380,54 278,48" fill="url(#trailCyan)" opacity="0.4" filter="url(#softGlow)"/>
    <circle cx="278" cy="45" r="4" fill="#ffffff" filter="url(#highGlow)"/>
    <circle cx="16" cy="50" r="4" fill="#ff1744" filter="url(#highGlow)"/>
  </g>

  <!-- VEHICLE 2: POLICE CRUISER WITH FLASHING STROBES (Right Mid-Ground) -->
  <g transform="translate(1080, 630)">
    <!-- Emergency Flasher Halo -->
    <circle cx="120" cy="5" r="50" fill="#00f3ff" opacity="0.35" filter="url(#softGlow)"/>
    <circle cx="150" cy="5" r="50" fill="#ff1744" opacity="0.35" filter="url(#softGlow)"/>
    <!-- Cruiser Body -->
    <path d="M20 40 C45 32 80 26 110 22 C135 12 180 12 210 20 C230 26 245 34 260 40 C270 44 265 52 250 54 C230 56 30 56 20 48 Z" fill="#090710" stroke="#79529cf0" stroke-width="1.5"/>
    <!-- Pushbar in Front -->
    <rect x="258" y="32" width="6" height="20" rx="1" fill="#4a3b63"/>
    <!-- Roof Lightbar -->
    <rect x="120" y="10" width="34" height="6" rx="2" fill="#120b1e" stroke="#ffffff" stroke-width="1"/>
    <rect x="122" y="11" width="13" height="4" fill="#00f3ff" filter="url(#highGlow)"/>
    <rect x="139" y="11" width="13" height="4" fill="#ff1744" filter="url(#highGlow)"/>
    <!-- Wheels -->
    <circle cx="65" cy="46" r="13" fill="#140d24" stroke="#5a3d7d" stroke-width="2"/>
    <circle cx="215" cy="44" r="13" fill="#140d24" stroke="#5a3d7d" stroke-width="2"/>
  </g>

  <!-- GTA 5 FIVEM ROLEPLAY HUD OVERLAYS (GLASSMORPHIC CARDS) -->

  <!-- Top-Left Brand / System Badge -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="380" height="74" rx="14" fill="url(#glassFill)" stroke="#a829f0" stroke-width="2" filter="url(#softGlow)"/>
    <circle cx="38" cy="37" r="16" fill="url(#badgeGrad)"/>
    <path d="M38 27 L44 37 L32 37 Z" fill="#ffffff"/>
    <text x="68" y="32" fill="#ffffff" font-family="'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="900" letter-spacing="2">SEMEISTVO TECH</text>
    <text x="68" y="52" fill="#00f3ff" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" letter-spacing="3">FIVEM ROLEPLAY ARCHITECTURE</text>
  </g>

  <!-- Top-Right Live Server Status HUD -->
  <g transform="translate(1080, 60)">
    <rect x="0" y="0" width="460" height="74" rx="14" fill="url(#glassFill)" stroke="#00f3ff" stroke-width="2" filter="url(#softGlow)"/>
    <!-- Slot Indicator -->
    <circle cx="36" cy="37" r="6" fill="#00e676" filter="url(#highGlow)"/>
    <text x="52" y="33" fill="#8bf8c9" font-family="'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="800" letter-spacing="1.5">SERVER STATUS</text>
    <text x="52" y="54" fill="#ffffff" font-family="'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="900" letter-spacing="1">128 / 128 ONLINE</text>
    <line x1="225" y1="18" x2="225" y2="56" stroke="#5c3b80" stroke-width="1.5"/>
    <!-- Ping & FPS -->
    <text x="245" y="33" fill="#b39ddb" font-family="'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="700" letter-spacing="1">TICKRATE · LATENCY</text>
    <text x="245" y="54" fill="#00f3ff" font-family="'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="800">64-TICK · 18ms</text>
    <rect x="380" y="24" width="60" height="26" rx="6" fill="#2d1245" stroke="#ff2a85" stroke-width="1.5"/>
    <text x="410" y="42" fill="#ff79b0" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="800" text-anchor="middle">LIVE RP</text>
  </g>

  <!-- Bottom-Left Voice / Radio & Minimap Compass HUD -->
  <g transform="translate(60, 770)">
    <rect x="0" y="0" width="310" height="70" rx="12" fill="url(#glassFill)" stroke="#7e41b5" stroke-width="1.5"/>
    <!-- Radio Frequency -->
    <path d="M25 35 Q35 20 45 35 T65 35" stroke="#00f3ff" stroke-width="2.5" fill="none" filter="url(#softGlow)"/>
    <text x="80" y="30" fill="#9e85c2" font-family="'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="800" letter-spacing="2">RADIO FREQ</text>
    <text x="80" y="52" fill="#ffffff" font-family="'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="800" letter-spacing="1">104.2 MHz [WHISPER]</text>
  </g>

  <!-- Bottom-Right Framework & Database Integration Pill -->
  <g transform="translate(1160, 770)">
    <rect x="0" y="0" width="380" height="70" rx="12" fill="url(#glassFill)" stroke="#b537f2" stroke-width="1.5"/>
    <text x="30" y="30" fill="#b39ddb" font-family="'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="800" letter-spacing="2">FRAMEWORK &amp; INFRASTRUCTURE</text>
    <text x="30" y="52" fill="#00f3ff" font-family="'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="800">QBCore / ESX Legacy · MySQL / D1</text>
  </g>
</svg>
